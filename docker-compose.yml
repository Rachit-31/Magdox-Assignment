# The practice database. No password: it accepts connections from this computer only.
# Reset it at any time with: docker compose down && docker compose up -d
services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: devshelf
      POSTGRES_DB: devshelf
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devshelf -d devshelf"]
      interval: 2s
      timeout: 2s
      retries: 30
